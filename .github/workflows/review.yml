name: Singular Code Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
        type: string
      trigger_comment_id:
        description: Issue comment ID that requested the review. Leave empty for manual or non-comment triggers.
        required: false
        type: string
        default: ""
      npm_install:
        description: Install repository dependencies before review.
        required: false
        type: boolean
        default: false
      runner:
        description: Runner label used for the review job.
        required: false
        type: string
    secrets:
      SINGULAR_CODE_REVIEW_PRIVATE_KEY:
        description: GitHub App private key used to author review comments.
        required: true
      OPENCODE_API_KEY:
        description: OpenCode Go API key.
        required: true
      CONTEXT7_API_KEY:
        description: Optional Context7 API key for higher rate limits.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  agent:
    runs-on: "${{ inputs.runner || 'ubuntu-latest' }}"
    container:
      image: ghcr.io/we-are-singular/singular-code-review-agent:latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      TRIGGER_COMMENT_ID: ${{ inputs.trigger_comment_id }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4-flash' }}
      SINGULAR_CODE_REVIEW_INSTALL_DEPS: ${{ inputs.npm_install }}
    steps:
      - name: Run review preflight
        id: review-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2; do
            echo "review_preflight attempt ${attempt}/2"
            if /usr/local/bin/review_preflight; then
              exit 0
            else
              status=$?
            fi

            echo "::warning::review_preflight attempt ${attempt}/2 failed with status ${status}"
            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
          done

      - name: Create GitHub App token
        if: steps.review-preflight.outputs.should_review == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liVgvy1yaHapd0Wx
          private-key: ${{ secrets.SINGULAR_CODE_REVIEW_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout repository
        if: steps.review-preflight.outputs.should_review == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/pull/${{ inputs.pr_number }}/head
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Provision review workspace
        if: steps.review-preflight.outputs.should_review == 'true'
        run: /usr/local/bin/provision.sh

      - name: Run Singular Code Review
        if: steps.review-preflight.outputs.should_review == 'true'
        timeout-minutes: 42
        run: timeout 40m /usr/local/bin/review_runner --publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
